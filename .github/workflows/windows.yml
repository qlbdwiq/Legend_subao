name: Windows standalone application
on:
  workflow_call:
permissions:
  contents: read
jobs:
  standalone:
    name: Windows EXE build and frozen runtime checks
    # Repository variable WINDOWS_RUNNER (JSON labels, e.g. ["self-hosted","Windows","X64"]) selects a
    # self-hosted runner; without it the GitHub-hosted runner is used.
    runs-on: ${{ vars.WINDOWS_RUNNER && fromJSON(vars.WINDOWS_RUNNER) || 'windows-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            stages/01-camera-stream/requirements.txt
            stages/01-camera-stream/requirements-ultralytics.txt
            packaging/windows/requirements-build.txt
      - name: Install application and packaging dependencies
        run: |
          python -m pip install -r stages/01-camera-stream/requirements.txt -r packaging/windows/requirements-build.txt
          python -m pip install --no-deps -r stages/01-camera-stream/requirements-ultralytics.txt
      - name: Build single EXE and portable ZIP
        run: python scripts/build_windows.py
      - name: Launch copied EXE without Python or SDK paths; capture two files and two MJPEG inputs
        # PowerShell (the Windows default): works on runners without Git Bash.
        run: |
          $exe = Get-ChildItem dist/windows/DroneCollisionDetection-v*-windows-x64.exe | Select-Object -First 1
          python scripts/smoke_windows_exe.py $exe.FullName build/windows/evidence
      - name: Preserve frozen runtime reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-evidence
          path: build/windows/evidence/*
      - name: Upload tested standalone app
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone
          path: dist/windows/*
          if-no-files-found: error
