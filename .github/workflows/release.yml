name: Publish Windows standalone release

# Dispatch only AFTER the PR is merged. Tests run again on the exact release SHA.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-release
  cancel-in-progress: false

jobs:
  verify-target:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
  tests:
    needs: verify-target
    uses: ./.github/workflows/ci.yml
  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: windows-standalone-v0.2.1
          path: dist
      - run: python scripts/package_release.py
      - name: Publish source release without overwriting an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.1 >/dev/null 2>&1; then
            echo "v0.2.1 already exists; refusing to replace it."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.2.1; then
            echo "v0.2.1 tag already exists; inspect its target before publishing."
            exit 1
          fi
          test -s dist/DroneCollisionDetection-v0.2.1-windows-x64.exe
          test -s dist/DroneCollisionDetection-v0.2.1-windows-x64.zip
          gh release create v0.2.1 dist/phase-01-camera-stream-v0.2.1.zip dist/DroneCollisionDetection-* dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Windows Standalone EXE" \
            --notes-file docs/releases/v0.2.1.md
