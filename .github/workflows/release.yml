name: Publish release

# Publish by pushing a version tag (for example v0.5.0 or phase-01-v0.5.0) that
# points at a commit on the default branch. Tests and Windows/macOS builds run
# again on that exact commit. Existing releases and tags are never replaced.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'phase-*-v*.*.*'

permissions:
  contents: read

concurrency:
  group: camera-release
  cancel-in-progress: false

jobs:
  verify-target:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      phase: ${{ steps.v.outputs.phase }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Validate release tag and package version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Run this workflow by pushing a version tag."; exit 1
          fi
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^phase-([0-9]{2})-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            phase="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            phase="01"
            version="${BASH_REMATCH[1]}"
          else
            echo "Unsupported tag '$tag'. Use vX.Y.Z or phase-NN-vX.Y.Z."; exit 1
          fi
          test "$version" = "$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"',open('stages/01-camera-stream/src/drone_camera/__init__.py').read()).group(1))")"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          test -f "docs/releases/v$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  tests:
    needs: verify-target
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [verify-target, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify-target.outputs.version }}
      PHASE: ${{ needs.verify-target.outputs.phase }}
      RELEASE_TAG: ${{ needs.verify-target.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: windows-standalone
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*-standalone
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*-checksum
          path: checksums
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: drone-camera-android-v0.4.0
          path: mobile-dist
      - uses: actions/download-artifact@v4
        with:
          name: drone-camera-ios-v0.4.0
          path: mobile-dist
      - run: python scripts/package_release.py
      - name: Combine checksums
        run: |
          cat checksums/SHA256SUMS-macos-*.txt >> dist/SHA256SUMS.txt
          (cd mobile-dist && sha256sum *.apk *.ipa *-xcode-project.zip) >> dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Publish release without overwriting an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to replace it."; exit 1
          fi
          test -s "dist/DroneCollisionDetection-v$VERSION-windows-x64.exe"
          test -s "dist/DroneCollisionDetection-v$VERSION-windows-x64.zip"
          test -s "dist/DroneCollisionDetection-v$VERSION-macos-arm64.dmg"
          test -s "dist/DroneCollisionDetection-v$VERSION-macos-x64.dmg"
          test -s mobile-dist/drone-camera-android-v0.4.0-debug.apk
          test -s mobile-dist/drone-camera-ios-v0.4.0-unsigned.ipa
          test -s mobile-dist/drone-camera-ios-v0.4.0-xcode-project.zip
          title="$(sed -n 's/^# //p;T;q' "docs/releases/v$VERSION.md")"
          if [[ "$RELEASE_TAG" == phase-* ]]; then
            title="Phase $PHASE - $title"
          fi
          gh release create "$RELEASE_TAG" "dist/phase-01-camera-stream-v$VERSION.zip" dist/DroneCollisionDetection-* dist/SHA256SUMS.txt mobile-dist/* \
            --verify-tag --title "$title" \
            --notes-file "docs/releases/v$VERSION.md"
