name: Mobile camera builds
on:
  workflow_call:
permissions:
  contents: read
jobs:
  android:
    name: Android APK and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, APK and lint
        working-directory: apps/android-camera
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Desktop reads the Android server's real MJPEG protocol
        run: |
          python -m pip install numpy==2.2.6 opencv-python-headless==4.11.0.86
          python scripts/smoke_mobile_protocol.py
      - name: Verify development APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/android-camera/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p mobile-dist
          cp apps/android-camera/app/build/outputs/apk/debug/app-debug.apk mobile-dist/drone-camera-android-v0.2.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: drone-camera-android-v0.2.0
          path: mobile-dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: apps/android-camera/app/build/test-results/testDebugUnitTest/*.xml
  ios:
    name: iOS build, simulator tests and unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: apps/ios-camera
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Choose available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/simulators.json'))
          device=next(d for devices in data['devices'].values() for d in devices if 'iPhone' in d['name'])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+device['udid']+'\n')
          PY
      - name: Run Swift protocol unit tests on simulator
        working-directory: apps/ios-camera
        run: |
          set -o pipefail
          xcodebuild test -project DroneCamera.xcodeproj -scheme DroneCamera -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/ios-tests" -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/ios-test.log" 2>&1 || { tail -120 "$RUNNER_TEMP/ios-test.log"; exit 1; }
      - name: Compile arm64 iPhone application without signing
        working-directory: apps/ios-camera
        run: |
          xcodebuild build -project DroneCamera.xcodeproj -scheme DroneCamera -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-device" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/ios-build.log" 2>&1 || { tail -120 "$RUNNER_TEMP/ios-build.log"; exit 1; }
      - name: Package unsigned IPA and ready-to-open Xcode project
        run: python3 scripts/package_ios.py "$RUNNER_TEMP/ios-device/Build/Products/Release-iphoneos/DroneCamera.app" mobile-dist
      - uses: actions/upload-artifact@v4
        with:
          name: drone-camera-ios-v0.2.0
          path: mobile-dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-evidence
          path: |
            ${{ runner.temp }}/ios-test.log
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-tests.xcresult
