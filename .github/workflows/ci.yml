name: Camera streaming CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  macos-app:
    uses: ./.github/workflows/macos.yml
  mobile:
    uses: ./.github/workflows/mobile.yml
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.12']
        include:
          - os: macos-15-intel
            python: '3.11'
    runs-on: ${{ (matrix.os == 'windows-latest' && vars.WINDOWS_RUNNER) && fromJSON(vars.WINDOWS_RUNNER) || matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: stages/01-camera-stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            stages/01-camera-stream/requirements.txt
            stages/01-camera-stream/requirements-ultralytics.txt
      - name: Install dependencies
        # Ultralytics is installed with --no-deps so it cannot pull in the non-headless opencv-python.
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -r requirements-ultralytics.txt
      - name: Syntax and module imports
        run: |
          python -m compileall -q src
          python -c "import sys; sys.path.insert(0, 'src'); import cv2, numpy, PySide6, torch, torchvision, ultralytics, lap; import drone_camera.config, drone_camera.capture, drone_camera.gui, drone_camera.engine, drone_camera.ai_pipeline"
      - name: Validate example configuration
        run: python src/main.py --validate-config config.example.json
      # real_model tests need the trained best.pt, which is not in the repository: they are skipped
      # here and run locally with DRONE_YOLO_MODEL / DRONE_YOLO_SAMPLES (see docs/ai-detection.md).
      - name: Unit, real capture, AI runtime and offscreen GUI tests
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: stages/01-camera-stream/test-results.xml
          if-no-files-found: warn
      - name: Build and inspect release source ZIP
        working-directory: .
        # No shell-specific globbing, so this also runs where bash is not installed (Windows).
        run: |
          python scripts/package_release.py
          python -c "import glob,sys,zipfile; files=glob.glob('dist/phase-01-camera-stream-v*.zip'); assert files, 'source ZIP was not built'; bad=[f for f in files if zipfile.ZipFile(f).testzip()]; sys.exit(1 if bad else 0)"
